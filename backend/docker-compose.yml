services:
  postgres:
    image: postgres:16
    container_name: sonara-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - sonara_pgdata:/var/lib/postgresql/data

volumes:
  sonara_pgdata: