name: Flutter App Build

on:
  push:
    branches: [main]
    paths:
      - 'app/**'            # ← Nur bei App-Änderungen

jobs:
  build:
    runs-on: macos-latest   # macOS nötig für iOS Build
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build iOS (no signing yet)
        run: flutter build ios --release --no-codesign
