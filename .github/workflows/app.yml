name: Flutter App Build

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
  pull_request:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'app/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos
      
      - name: Run tests
        run: flutter test --coverage

      # Auf main: prod-Flavor bauen (der später ausgeliefert wird)
      - name: Build Android APK (prod)
        if: github.ref == 'refs/heads/main'
        run: flutter build apk --release --flavor prod -t lib/main.dart

      # Auf allen anderen Branches/PRs: dev-Flavor (schneller Compile-Check)
      - name: Build Android APK (dev)
        if: github.ref != 'refs/heads/main'
        run: flutter build apk --release --flavor dev -t lib/main_dev.dart